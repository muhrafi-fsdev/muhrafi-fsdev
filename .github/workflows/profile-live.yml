name: Refresh Profile Repository Activity

on:
  workflow_dispatch:
  schedule:
    - cron: "42 2 * * *"
  push:
    branches: [main]
    paths:
      - README.md
      - .github/scripts/update_profile_stats.py
      - .github/workflows/profile-live.yml

permissions:
  contents: write

concurrency:
  group: profile-repository-activity
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'muhrafi-fsdev/muhrafi-fsdev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Read real project metadata from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_profile_stats.py
      - name: Commit native Markdown activity changes if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Profile already up to date"
            exit 0
          fi
          git commit -m "chore(profile): refresh live repository metadata"
          git push origin HEAD:main
