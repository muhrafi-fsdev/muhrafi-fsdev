<text x="1024" y="43" class="mono" font-size="13" fill="#456078">BUILD MODE</text>
<text x="48" y="100" class="mono" font-size="15" font-weight="750" letter-spacing="2" fill="#087E9A">LAUNCH.SEQUENCE</text>
<text x="47" y="144" class="sans" font-size="38" font-weight="780" letter-spacing="-.5" fill="#17283B">Building Ideas Into Production</text>
<text x="48" y="178" class="sans" font-size="18" fill="#456078">Full-stack development  ·  Local AI  ·  Web platforms  ·  IoT systems</text>
