</g>
<g fill="#39D5E7" opacity=".5">
<circle cx="684" cy="103" r="2" class="star"/><circle cx="744" cy="228" r="2" class="star"/>
<circle cx="1059" cy="103" r="2" class="star"/><circle cx="1124" cy="224" r="2" class="star"/>
</g>
