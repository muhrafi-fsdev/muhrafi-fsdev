<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="318" viewBox="0 0 1180 318" role="img" aria-labelledby="title desc">
<title id="title">Launch sequence | Building Ideas Into Production</title>
<desc id="desc">Pixel rocket above a two-mission developer board. Animation moves slowly and honors reduced motion preferences.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D19"/><stop offset="1" stop-color="#0B1728"/></linearGradient>
<linearGradient id="border-grad"><stop stop-color="#B3A0FF"/><stop offset=".5" stop-color="#39D5E7"/><stop offset="1" stop-color="#45D6B1"/></linearGradient>
<style>
.sans{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.mono{font-family:ui-monospace,Consolas,monospace}
.float{animation:bob 5.5s ease-in-out infinite}
.flame{animation:soft-flame 1.2s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
.star{animation:twinkle 5.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes soft-flame{0%,100%{transform:scaleY(.86);opacity:.9}50%{transform:scaleY(1.05);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:.65}}
@media(prefers-reduced-motion:reduce){.float,.flame,.star{animation:none}}
</style>
</defs>
<rect x="2" y="2" width="1176" height="314" rx="16" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="2"/>
<rect x="22" y="18" width="1136" height="39" rx="8" fill="#101D30" stroke="#2A405C" stroke-opacity=".6"/>
<circle cx="42" cy="37.5" r="4.5" fill="#FF625A"/><circle cx="59" cy="37.5" r="4.5" fill="#FFBD2E"/><circle cx="76" cy="37.5" r="4.5" fill="#35C75A"/>
<text x="98" y="43" class="mono" font-size="14" fill="#A9BCD1">mission-control://muhrafi-fsdev</text>
<circle cx="1010" cy="38" r="4" fill="#45D6B1"/>
<text x="1024" y="43" class="mono" font-size="13" fill="#A9BCD1">BUILD MODE</text>
<text x="48" y="100" class="mono" font-size="15" font-weight="750" letter-spacing="2" fill="#39D5E7">LAUNCH.SEQUENCE</text>
<text x="47" y="144" class="sans" font-size="38" font-weight="780" letter-spacing="-.5" fill="#F1F6FC">Building Ideas Into Production</text>
<text x="48" y="178" class="sans" font-size="18" fill="#A9BCD1">Full-stack development  ·  Local AI  ·  Web platforms  ·  IoT systems</text>
