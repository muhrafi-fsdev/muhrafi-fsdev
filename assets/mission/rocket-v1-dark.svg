<rect width="264" height="76" rx="11" fill="#101D30" stroke="#2A405C"/>
<rect x="14" y="16" width="5" height="43" rx="2.5" fill="#45D6B1"/>
<text x="31" y="29" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#A9BCD1" letter-spacing="1">CURRENT BUILD</text>
<text x="31" y="54" class="sans" font-size="18" font-weight="750" fill="#F1F6FC">NusaMind Systems</text>
</g>
